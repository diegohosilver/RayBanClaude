# Builds the iPhone app in the cloud (free for public repos) – no Mac of your own needed.
# Result: RayBanClaude.ipa (unsigned) → install on Windows with Sideloadly + a free Apple ID.
name: Build iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios-build.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPA
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode (Swift 6.3+ for the Meta DAT SDK 1.x)
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project RayBanClaude.xcodeproj \
            -scheme RayBanClaude \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Compiler warnings in our own code
        working-directory: ios
        run: |
          grep -E "RayBanClaude/.*warning:" build.log | sed 's|.*/RayBanClaude/||' | sort -u | head -100 || true
          echo "Count: $(grep -cE 'RayBanClaude/.*warning:' build.log || true)"

      - name: Error output
        if: failure()
        working-directory: ios
        run: grep -E -B2 -A6 "error:" build.log | head -300 || tail -200 build.log

      - name: Package IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RayBanClaude.app Payload/
          zip -qry RayBanClaude.ipa Payload
          ls -lh RayBanClaude.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RayBanClaude-ipa
          path: ios/RayBanClaude.ipa
          retention-days: 30

  release:
    name: Attach IPA to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: RayBanClaude-ipa
      - name: Create checksum
        run: sha256sum RayBanClaude.ipa | tee RayBanClaude.ipa.sha256

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" RayBanClaude.ipa RayBanClaude.ipa.sha256 --clobber --repo "$GITHUB_REPOSITORY"
